<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑫多多</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>鑫多多</h1>
            </div>
            <div class="nav-section">
                <div class="nav-item active" data-page="money-flow">
                    <span class="nav-icon">💰</span>
                    <span>资金流向</span>
                </div>
                <div class="nav-item" data-page="watchlist">
                    <span class="nav-icon">⭐</span>
                    <span>自选股</span>
                </div>
                <div class="nav-item" data-page="stock-pick">
                    <span class="nav-icon">🔍</span>
                    <span>选股</span>
                </div>
                <div class="nav-item" data-page="tech-pick">
                    <span class="nav-icon">📊</span>
                    <span>技术选股</span>
                </div>
                <div class="nav-item" data-page="unlock-list">
                    <span class="nav-icon">🔓</span>
                    <span>解禁列表</span>
                </div>
                <div class="nav-item" data-page="earnings">
                    <span class="nav-icon">📋</span>
                    <span>业绩披露</span>
                </div>
                <div class="nav-item" data-page="announce">
                    <span class="nav-icon">📢</span>
                    <span>公司公告</span>
                </div>
                <div class="nav-item" data-page="abnormal">
                    <span class="nav-icon">⚡</span>
                    <span>异动中心</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <!-- 资金流向页面 -->
            <div id="page-money-flow">
                <div class="page-header">
                    <h1 class="page-title">💰 资金流向</h1>
                    <button class="refresh-btn" onclick="clearAllCaches(); loadAllData();">🗑 清理缓存</button>
                </div>

                <div class="index-card" id="index-card">
                    <div class="loading">正在加载上证指数...</div>
                </div>
            </div>

            <!-- 自选股页面 -->
            <div id="page-watchlist" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">⭐ 自选股</h1>
                </div>
                <div class="index-card" style="padding:30px;">
                    <div id="watchlistStocks" style="margin-top:8px;"></div>
                </div>
            </div>

            <!-- 技术选股页面 -->
            <div id="page-tech-pick" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">📊 技术选股</h1>
                    <button class="refresh-btn" onclick="runTechScreen('ascending-channel')" id="techScreenBtn">上升通道</button>
                </div>
                <div class="index-card" style="padding:15px;">
                    <div id="techScreenStatus" style="color:#888;text-align:center;padding:20px;">点击上方按钮开始扫描</div>
                    <div id="techScreenResult" style="margin-top:8px;"></div>
                </div>
            </div>

            <!-- 解禁列表页面 -->
            <div id="page-unlock-list" style="display:none;">
                <div class="page-header"><h1 class="page-title">🔓 解禁列表</h1></div>
                <div class="index-card" style="padding:40px;text-align:center;color:#888;">功能开发中...</div>
            </div>

            <!-- 业绩披露页面 -->
            <div id="page-earnings" style="display:none;">
                <div class="page-header"><h1 class="page-title">📋 业绩披露</h1></div>
                <div class="index-card" style="padding:40px;text-align:center;color:#888;">功能开发中...</div>
            </div>

            <!-- 公司公告页面 -->
            <div id="page-announce" style="display:none;">
                <div class="page-header"><h1 class="page-title">📢 公司公告</h1></div>
                <div class="index-card" style="padding:40px;text-align:center;color:#888;">功能开发中...</div>
            </div>

            <!-- 异动中心页面 -->
            <div id="page-abnormal" style="display:none;">
                <div class="page-header"><h1 class="page-title">⚡ 异动中心</h1></div>
                <div class="index-card" style="padding:40px;text-align:center;color:#888;">功能开发中...</div>
            </div>

            <!-- 选股页面 -->
            <div id="page-stock-pick" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">🔍 选股</h1>
                </div>
                <div class="index-card" style="padding:30px;">
                    <div style="max-width:600px; margin:0 auto; position:relative;">
                        <div style="display:flex; gap:10px; margin-bottom:8px;">
                            <input id="searchInput" type="text" autocomplete="off" placeholder="输入股票名称或代码..." style="flex:1; padding:12px 16px; border:1px solid #0f3460; border-radius:8px; background:#1a1a2e; color:#fff; font-size:15px; outline:none;" oninput="debounceSearch()" onkeydown="handleSearchKey(event)" onfocus="debounceSearch()" onblur="setTimeout(()=>{if(!document.querySelector('#searchResults:hover')){document.getElementById('searchResults').innerHTML='';searchResultsData=[];selectedSearchIdx=-1;}},200)">
                        </div>
                        <div id="searchResults" style="position:absolute; left:0; right:0; top:56px; z-index:10; background:#16213e; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.5);"></div>
                    </div>
                    <div id="pickedStocks" style="margin-top:8px;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS：共享状态 + 导航/Tab 绑定 + 启动 -->
    <script>
        var currentNavPage = 'money-flow';
        var minuteChart = null;
        var turnoverChart = null;
        var marginChart = null;
        var fullMinuteSlots = [];
        var fullFlowSlots = [];

        var fearExplain = '<div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05); font-size:10px; color:#555; line-height:1.5;">' +
            '沪深指数平均涨跌=上证+深证涨幅均值 | 30分钟跌速=日内最大30分跌幅 | ' +
            '日内回撤=最高到最低跌幅 | 振幅=(高-低)/昨收 | ' +
            '红盘率=上涨家数占比 | 主力净流入=沪深主力累计' +
            '</div>';
        var riskExplain = '<div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05); font-size:10px; color:#555; line-height:1.5;">' +
            '融资余额5日=两市融资近5日变动 | 两融余额10日=融资+融券近10日变动 | ' +
            '融资活跃度=当日买入vs20日均值 | 5/10日涨跌=沪深均值 | ' +
            '回撤=20日最大跌幅 | 波动率=10日日收益率标准差 | ' +
            '情绪面=恐慌指数+红盘率得分 | 涨跌结构=涨跌家数差得分' +
            '</div>';

        // 左侧导航
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                const page = this.getAttribute('data-page');
                currentNavPage = page;
                document.getElementById('page-money-flow').style.display = page === 'money-flow' ? 'block' : 'none';
                document.getElementById('page-stock-pick').style.display = page === 'stock-pick' ? 'block' : 'none';
                document.getElementById('page-watchlist').style.display = page === 'watchlist' ? 'block' : 'none';
                document.getElementById('page-tech-pick').style.display = page === 'tech-pick' ? 'block' : 'none';
                document.getElementById('page-unlock-list').style.display = page === 'unlock-list' ? 'block' : 'none';
                document.getElementById('page-earnings').style.display = page === 'earnings' ? 'block' : 'none';
                document.getElementById('page-announce').style.display = page === 'announce' ? 'block' : 'none';
                document.getElementById('page-abnormal').style.display = page === 'abnormal' ? 'block' : 'none';
                if (page === 'money-flow') loadAllData();
            });
        });

        // ---- 技术选股 ----
        var _techPollTimer = null;
        function _techRenderTable(data) {
            var html = '<div class="data-table"><table><thead><tr><th>代码</th><th>名称</th><th>价格</th><th>评分</th><th>通道上轨</th><th>通道下轨</th><th>位置%</th><th>通道宽%</th><th>量比</th></tr></thead><tbody>';
            data.forEach(function(s) {
                var d = s.detail || {};
                var mk = String(s.code).match(/^(6|9)/) ? '1' : '0';
                html += '<tr>' +
                    '<td><span style="color:#888;">' + s.code + '</span></td>' +
                    '<td><span style="color:#fff;cursor:pointer;text-decoration:underline;" onclick="KlinePopup.open(\'' + s.code + '\',\'' + mk + '\',\'' + s.name + '\')">' + s.name + '</span></td>' +
                    '<td><span style="color:#ddd;">' + s.price + '</span></td>' +
                    '<td><span style="color:#fbbf24;font-weight:bold;">' + s.score + '</span></td>' +
                    '<td><span style="color:#ef5350;">' + d.upper + '</span></td>' +
                    '<td><span style="color:#26a69a;">' + d.lower + '</span></td>' +
                    '<td><span style="color:#ddd;">' + d.pos + '%</span></td>' +
                    '<td><span style="color:#ddd;">' + d.channel_width_pct + '%</span></td>' +
                    '<td><span style="color:#ddd;">' + d.vol_ratio + '</span></td>' +
                '</tr>';
            });
            html += '</tbody></table></div>';
            document.getElementById('techScreenResult').innerHTML = html;
        }
        async function runTechScreen(type) {
            var status = document.getElementById('techScreenStatus');
            var btn = document.getElementById('techScreenBtn');
            if (_techPollTimer) { clearInterval(_techPollTimer); _techPollTimer = null; }
            status.textContent = '启动扫描...';
            status.style.color = '#fbbf24';
            btn.disabled = true;
            try {
                var res = await fetch('/api/technical/ascending-channel', { method: 'POST' });
                var data = await res.json();
                if (!data.success) { status.textContent = data.error; status.style.color = '#e94560'; btn.disabled = false; return; }
                _techPollTimer = setInterval(async function() {
                    try {
                        var pr = await fetch('/api/technical/ascending-channel/status');
                        var pd = await pr.json();
                        if (pd.running) {
                            status.textContent = '扫描中... ' + pd.done + '/' + pd.total + ' | 已找到 ' + pd.results.length + ' 只';
                        } else {
                            clearInterval(_techPollTimer); _techPollTimer = null;
                            status.textContent = '共找到 ' + pd.results.length + ' 只股票';
                            status.style.color = '#4ade80';
                            btn.disabled = false;
                            if (pd.results.length > 0) _techRenderTable(pd.results);
                        }
                    } catch(e) {
                        clearInterval(_techPollTimer); _techPollTimer = null;
                        status.textContent = '状态查询出错';
                        status.style.color = '#e94560';
                        btn.disabled = false;
                    }
                }, 2000);
            } catch(e) {
                status.textContent = '扫描出错: ' + e.message;
                status.style.color = '#e94560';
                btn.disabled = false;
            }
        }

    </script>

    <!-- JS 模块（按功能拆分） -->
    <script src="/static/js/common.js"></script>
    <script src="/static/js/money_flow/charts.js"></script>
    <script src="/static/js/stock_pick/service.js"></script>
    <script src="/static/js/watchlist/service.js"></script>
    <script src="/static/js/kline/chart.js"></script>
    <script src="/static/js/kline/minute.js"></script>
    <script src="/static/js/kline/fiveday.js"></script>
    <script src="/static/js/kline/popup.js"></script>
    <script src="/static/js/money_flow/refresh.js"></script>

    <!-- 启动（所有 JS 加载完毕后执行） -->
    <script>
        loadAllData();
        loadPickedStocks();
        loadWatchlistStocks();
        setInterval(refreshRealtimeData, 10000);
    </script>
</body>
</html>
