<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑫多多 - 资金流向</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>鑫多多</h1>
            </div>
            <div class="nav-section">
                <div class="nav-item active" data-page="money-flow">
                    <span class="nav-icon">💰</span>
                    <span>资金流向</span>
                </div>
                <div class="nav-item" data-page="stock-pick">
                    <span class="nav-icon">🔍</span>
                    <span>选股</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <!-- 资金流向页面 -->
            <div id="page-money-flow">
                <div class="page-header">
                    <h1 class="page-title">💰 资金流向</h1>
                    <button class="refresh-btn" onclick="loadAllData()">🔄 刷新数据</button>
                </div>

                <div class="index-card" id="index-card">
                    <div class="loading">正在加载上证指数...</div>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-page="concept">
                        💡 概念板块
                    </button>
                    <button class="tab-btn" data-page="industry">
                        🏭 行业板块
                    </button>
                    <button class="tab-btn" data-page="index">
                        📊 指数板块
                    </button>
                </div>

                <div id="content-area">
                    <div class="loading">正在加载数据...</div>
                </div>
            </div>

            <!-- 选股页面 -->
            <div id="page-stock-pick" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">🔍 选股</h1>
                </div>
                <div class="index-card" style="padding:30px;">
                    <div style="max-width:600px; margin:0 auto;">
                        <div style="display:flex; gap:10px; margin-bottom:20px;">
                            <input id="searchInput" type="text" placeholder="输入股票名称或代码..." style="flex:1; padding:12px 16px; border:1px solid #0f3460; border-radius:8px; background:#1a1a2e; color:#fff; font-size:15px; outline:none;" onkeyup="if(event.key==='Enter')searchStock()">
                            <button onclick="searchStock()" style="padding:12px 24px; background:#e94560; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:15px;">搜索</button>
                        </div>
                        <div id="searchResults" style="min-height:200px;">
                            <div style="text-align:center; color:#666; padding:40px;">输入股票名称或代码开始搜索</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 'concept';
        let minuteChart = null;
        let turnoverChart = null;
        let marginChart = null;

        function formatTurnover(value) {
            if (value >= 10000) {
                return (value / 10000).toFixed(2) + '万亿';
            }
            return value.toFixed(2) + '亿';
        }

        async function loadIndexWithChart() {
            const indexCard = document.getElementById('index-card');
            indexCard.innerHTML = '<div class="loading">正在加载上证指数...</div>';

            try {
                const indexRes = await fetch('/api/major-indices');
                const indexResult = await indexRes.json();

                let indexData = null;
                if (indexResult.success && indexResult.data.length > 0) {
                    indexData = indexResult.data[0];
                }

                if (!indexData) {
                    indexCard.innerHTML = '<div class="error">暂无指数数据</div>';
                    return;
                }

                const isUp = indexData.change.startsWith('+');
                const changeClass = isUp ? 'up' : 'down';
                const lineColor = isUp ? '#e94560' : '#4ade80';
                const gradientColor = isUp ? 'rgba(233, 69, 96, 0.2)' : 'rgba(74, 222, 128, 0.2)';

                indexCard.innerHTML = `
                        <div class="index-header">
                            <div class="index-info">
                                <span class="index-name">${indexData.name}</span>
                                <span class="index-price" style="color: ${lineColor};">${indexData.price}</span>
                                <span class="index-change ${changeClass}">${indexData.change} ${indexData.change_value}</span>
                                <span id="marketBreadth" style="font-size: 12px; color: #888;"></span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 30px; font-size: 13px; color: #888; margin-bottom: 15px;">
                            <span>加载中...</span>
                        </div>
                        <div style="display: flex; gap: 15px;">
                            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
                                <div class="chart-box" style="position:relative;">
                                    <canvas id="minuteChart"></canvas>
                                    <div id="minuteLoading" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;pointer-events:none;">加载中...</div>
                                    <div class="chart-title">分时走势</div>
                                </div>
                                <div class="chart-box">
                                    <canvas id="turnoverChart"></canvas>
                                    <div class="chart-title">大盘净资金流入</div>
                                </div>
                                <div class="chart-box">
                                    <canvas id="marginChart"></canvas>
                                    <div class="chart-title">融资融券</div>
                                </div>
                            </div>
                            <div style="width: 220px; min-width: 220px; display: flex; flex-direction: column;">
                                <div class="index-card" style="height: 100%; padding: 18px;">
                                    <div class="chart-title" style="margin-bottom: 12px;">市场风险指数</div>
                                    <div id="riskIndex" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100% - 30px);">
                                        <div class="loading">加载中...</div>
                                    </div>
                                </div>
                            </div>
                            <div style="width: 220px; min-width: 220px; display: flex; flex-direction: column;">
                                <div class="index-card" style="height: 100%; padding: 18px;">
                                    <div class="chart-title" style="margin-bottom: 12px;">市场恐慌指数</div>
                                    <div id="fearIndex" style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: calc(100% - 30px);">
                                        <div class="loading">加载中...</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                // 等待真实分时数据到达后再绘制图表，避免显示直线 mock 数据

                fetch('/api/turnover-minute')
                    .then(res => res.json())
                    .then(turnoverResult => {
                        const headerDiv1 = indexCard.querySelector('div[style*="gap: 30px"]');
                        let turnoverHeader = {};
                        if (turnoverResult.success && turnoverResult.data.header) {
                            turnoverHeader = turnoverResult.data.header;
                        }
                        let headerInfo = '';
                        if (turnoverHeader && turnoverHeader.turnover) {
                            const todayTurnover = turnoverHeader.turnover / 100000000;
                            const yesterdayTurnover = turnoverHeader.turnover_pre / 100000000;
                            const change = turnoverHeader.turnover_change / 100000000;
                            headerInfo = `
                                <div style="display: flex; gap: 30px; font-size: 13px; color: #888;">
                                    <span>当日成交额: <span style="color: #fff;">${todayTurnover.toFixed(2)}亿</span></span>
                                    <span>昨日成交额: <span style="color: #fff;">${yesterdayTurnover.toFixed(2)}亿</span></span>
                                    <span>较昨日变动: <span style="color: ${change >= 0 ? '#e94560' : '#4ade80'};">${change >= 0 ? '+' : ''}${change.toFixed(2)}亿</span></span>
                                </div>
                            `;
                        }
                        if (headerDiv1) headerDiv1.innerHTML = headerInfo || '<span style="color:#888;">暂无成交额数据</span>';
                    })
                    .catch(err => console.log('成交额数据加载失败:', err));

                fetch('/api/market-fund-flow')
                    .then(res => res.json())
                    .then(flowResult => {
                        let flowTimes = [];
                        let flows = [];
                        let flowsMid = [];
                        let flowsSmall = [];
                        let totalFlow = 0;

                        if (flowResult.success && flowResult.data.times) {
                            flowTimes = flowResult.data.times;
                            flows = flowResult.data.flows;
                            flowsMid = flowResult.data.flows_mid || [];
                            flowsSmall = flowResult.data.flows_small || [];
                            totalFlow = flows.length > 0 ? flows[flows.length - 1] : 0;
                        }

                        // 更新 header 追加大盘资金净流入
                        const headerDiv2 = indexCard.querySelector('div[style*="gap: 30px"]');
                        if (headerDiv2 && flowResult.success) {
                            const flowColor = totalFlow >= 0 ? '#e94560' : '#4ade80';
                            headerDiv2.innerHTML += `<span>大盘资金净流入: <span style="color: ${flowColor};">${totalFlow >= 0 ? '+' : ''}${totalFlow.toFixed(2)}亿</span></span>`;
                        }

                        const ctxTurnover = document.getElementById('turnoverChart').getContext('2d');
                        if (turnoverChart) turnoverChart.destroy();

                        turnoverChart = new Chart(ctxTurnover, {
                            type: 'line',
                            data: {
                                labels: flowTimes,
                                datasets: [{
                                    data: flows,
                                    borderColor: '#fbbf24',
                                    backgroundColor: function(context) {
                                        const chart = context.chart;
                                        const ctx = chart.ctx;
                                        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
                                        gradient.addColorStop(0, 'rgba(233, 69, 96, 0.25)');
                                        gradient.addColorStop(0.5, 'rgba(233, 69, 96, 0.05)');
                                        gradient.addColorStop(0.5, 'rgba(74, 222, 128, 0.05)');
                                        gradient.addColorStop(1, 'rgba(74, 222, 128, 0.25)');
                                        return gradient;
                                    },
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: true
                                }, {
                                    data: flowsMid,
                                    borderColor: '#a78bfa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [3, 5],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false
                                }, {
                                    data: flowsSmall,
                                    borderColor: '#60a5fa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [4, 3],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false
                                }, {
                                    data: Array(flowTimes.length).fill(0),
                                    borderColor: 'rgba(255,255,255,0.3)',
                                    borderWidth: 1,
                                    borderDash: [4, 4],
                                    pointRadius: 0,
                                    fill: false
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                layout: { padding: { left: 10, right: 10 } },
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        mode: 'index', intersect: false,
                                        backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#ddd', borderColor: '#0f3460', borderWidth: 1,
                                        callbacks: { label: function(context) { const v = context.raw; if (context.datasetIndex === 3) return ''; const labels = ['大盘资金', '中单', '散户']; return labels[context.datasetIndex] + ': ' + (v >= 0 ? '+' : '') + v.toFixed(2) + '亿'; } }
                                    }
                                },
                                scales: {
                                    x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', autoSkip: false, maxRotation: 0, font: { size: 10 }, callback: function(value, index) { return index % 15 === 0 ? this.getLabelForValue(value) : ''; } } },
                                    y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', font: { size: 10 }, callback: function(value) { return value.toFixed(2) + '亿'; } }, afterFit: function(scale) { scale.width = 65; } }
                                },
                                interaction: { mode: 'index', intersect: false }
                            }
                        });
                    })
                    .catch(err => console.log('资金流数据加载失败:', err));

                fetch('/api/margin-trading')
                    .then(res => res.json())
                    .then(marginResult => {
                        const ctxMargin = document.getElementById('marginChart').getContext('2d');
                        if (marginChart) marginChart.destroy();

                        let marginDates = [];
                        let rzBalances = [];
                        let rqBalances = [];
                        let totalBalances = [];
                        let buyAmounts = [];

                        if (marginResult.success && marginResult.data.dates) {
                            marginDates = marginResult.data.dates;
                            rzBalances = marginResult.data.rz_balances;
                            rqBalances = marginResult.data.rq_balances;
                            totalBalances = marginResult.data.total_balances;
                            buyAmounts = marginResult.data.buy_amounts;
                        }

                        marginChart = new Chart(ctxMargin, {
                            type: 'line',
                            data: {
                                labels: marginDates,
                                datasets: [{
                                    label: '两融余额',
                                    data: totalBalances,
                                    borderColor: '#fbbf24',
                                    backgroundColor: 'rgba(251,191,36,0.08)',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: true,
                                    yAxisID: 'y'
                                }, {
                                    label: '融资余额',
                                    data: rzBalances,
                                    borderColor: '#e94560',
                                    backgroundColor: 'transparent',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y'
                                }, {
                                    label: '融券余额',
                                    data: rqBalances,
                                    borderColor: '#4ade80',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y1'
                                }, {
                                    label: '融资买入额',
                                    data: buyAmounts,
                                    borderColor: '#60a5fa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [4, 3],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y1'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                layout: { padding: { left: 10, right: 10 } },
                                plugins: {
                                    legend: { display: true, position: 'top', labels: { color: '#888', font: { size: 10 }, boxWidth: 12, padding: 5 } },
                                    tooltip: {
                                        mode: 'index', intersect: false,
                                        backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#ddd', borderColor: '#0f3460', borderWidth: 1,
                                        callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.raw.toFixed(2) + '亿' }
                                    }
                                },
                                scales: {
                                    x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#888', font: { size: 10 }, maxTicksLimit: 14 } },
                                    y: {
                                        type: 'linear', position: 'left',
                                        grid: { color: 'rgba(255,255,255,0.1)' },
                                        ticks: { color: '#e94560', font: { size: 10 }, callback: v => (v / 10000).toFixed(2) + '万亿' },
                                        afterFit: function(scale) { scale.width = 65; }
                                    },
                                    y1: {
                                        type: 'linear', position: 'right',
                                        grid: { display: false },
                                        ticks: { color: '#4ade80', font: { size: 10 }, callback: v => v.toFixed(0) + '亿' },
                                        afterFit: function(scale) { scale.width = 50; }
                                    }
                                },
                                interaction: { mode: 'index', intersect: false }
                            }
                        });
                    })
                    .catch(err => console.log('融资融券数据加载失败:', err));

                fetch('/api/fear-index')
                    .then(res => res.json())
                    .then(fearResult => {
                        const fearDiv = document.getElementById('fearIndex');
                        if (fearResult.success && fearResult.data) {
                            const d = fearResult.data;
                            // 涨跌数据放到 header
                            const breadthDiv = document.getElementById('marketBreadth');
                            if (breadthDiv) {
                                breadthDiv.innerHTML = `涨<span style="color:#e94560;">${d.rise}</span> 跌<span style="color:#4ade80;">${d.fall}</span> 平<span style="color:#888;">${d.flat}</span>`;
                            }
                            // 恐慌指数卡片
                            fearDiv.innerHTML = `
                                <div style="font-size:28px; font-weight:bold; color:${d.color}; margin-bottom:5px;">${d.score}</div>
                                <div style="font-size:14px; color:${d.color}; margin-bottom:12px;">${d.level}</div>
                                <div style="width:100%; position:relative; margin-bottom:8px;">
                                    <div style="width:100%; height:12px; border-radius:6px; background: linear-gradient(to right, #4ade80 0%, #86efac 30%, #fbbf24 50%, #f97316 70%, #e94560 100%);"></div>
                                    <div style="position:absolute; top:-3px; left:${d.score}%; width:4px; height:18px; background:#fff; border-radius:2px; transform:translateX(-50%); box-shadow:0 0 6px rgba(255,255,255,0.5);"></div>
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:10px; color:#666;">
                                    <span>恐慌</span><span>中性</span><span>贪婪</span>
                                </div>
                            `;
                        } else {
                            fearDiv.innerHTML = '<div class="error">暂无数据</div>';
                        }
                    })
                    .catch(err => console.log('恐慌指数加载失败:', err));

                fetch('/api/risk-index')
                    .then(res => res.json())
                    .then(riskResult => {
                        const riskDiv = document.getElementById('riskIndex');
                        if (riskResult.success && riskResult.data) {
                            const d = riskResult.data;
                            riskDiv.innerHTML = `
                                <div style="font-size:28px; font-weight:bold; color:${d.color}; margin-bottom:5px;">${d.score}</div>
                                <div style="font-size:14px; color:${d.color}; margin-bottom:12px;">${d.level}</div>
                                <div style="width:100%; position:relative; margin-bottom:8px;">
                                    <div style="width:100%; height:12px; border-radius:6px; background: linear-gradient(to right, #4ade80 0%, #86efac 30%, #fbbf24 50%, #f97316 70%, #e94560 100%);"></div>
                                    <div style="position:absolute; top:-3px; left:${d.score}%; width:4px; height:18px; background:#fff; border-radius:2px; transform:translateX(-50%); box-shadow:0 0 6px rgba(255,255,255,0.5);"></div>
                                </div>
                                <div style="display:flex; justify-content:space-between; font-size:10px; color:#666;">
                                    <span>低风险</span><span>中风险</span><span>高风险</span>
                                </div>
                            `;
                        } else {
                            riskDiv.innerHTML = '<div class="error">暂无数据</div>';
                        }
                    })
                    .catch(err => console.log('风险指数加载失败:', err));

                fetch('/api/sh000001-minute')
                    .then(res => res.json())
                    .then(minuteResult => {
                        const minuteLoading = document.getElementById('minuteLoading');
                        if (minuteResult.success && minuteResult.data.times && minuteResult.data.prices && minuteResult.data.times.length > 0) {
                            const times = minuteResult.data.times;
                            const prices = minuteResult.data.prices;
                            const preClose = minuteResult.data.preClose || 0;

                            // 以昨收为中线，计算上下范围
                            let maxDev = 0;
                            prices.forEach(p => { const d = Math.abs(p - preClose); if (d > maxDev) maxDev = d; });
                            maxDev = Math.max(maxDev * 1.15, preClose * 0.005);
                            const yMin = preClose - maxDev;
                            const yMax = preClose + maxDev;

                            const ctxMinute = document.getElementById('minuteChart').getContext('2d');
                            if (minuteChart) minuteChart.destroy();

                            const gradient = ctxMinute.createLinearGradient(0, 0, 0, 180);
                            gradient.addColorStop(0, gradientColor);
                            gradient.addColorStop(1, 'rgba(26, 26, 46, 0)');

                            minuteChart = new Chart(ctxMinute, {
                                type: 'line',
                                data: {
                                    labels: times,
                                    datasets: [{
                                        data: prices,
                                        borderColor: lineColor,
                                        backgroundColor: gradient,
                                        borderWidth: 2,
                                        fill: true,
                                        tension: 0.1,
                                        pointRadius: 0,
                                        pointHoverRadius: 4
                                    }, {
                                        data: Array(times.length).fill(preClose),
                                        borderColor: '#888888',
                                        borderWidth: 1,
                                        borderDash: [6, 4],
                                        pointRadius: 0,
                                        pointHoverRadius: 0,
                                        fill: false,
                                        order: 1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    layout: { padding: { left: 10, right: 10 } },
                                    plugins: {
                                        legend: { display: false },
                                        tooltip: {
                                            mode: 'index', intersect: false,
                                            callbacks: {
                                                label: function(ctx) {
                                                    if (ctx.datasetIndex === 1) return '';
                                                    const price = ctx.raw;
                                                    const preClose = minuteResult.data.preClose || 0;
                                                    const change = price - preClose;
                                                    const pct = preClose ? (change / preClose * 100) : 0;
                                                    const sign = change >= 0 ? '+' : '';
                                                    return [
                                                        '指数: ' + price.toFixed(2),
                                                        sign + pct.toFixed(2) + '%  ' + sign + change.toFixed(2)
                                                    ];
                                                }
                                            }
                                        }
                                    },
                                    scales: {
                                        x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', autoSkip: false, maxRotation: 0, callback: function(value, index) { return index % 3 === 0 ? this.getLabelForValue(value) : ''; } } },
                                        y: { min: yMin, max: yMax, grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', callback: v => v.toFixed(0) }, afterFit: function(scale) { scale.width = 65; } }
                                    },
                                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                                },

                            });
                            if (minuteLoading) minuteLoading.style.display = 'none';
                        } else {
                            // 分时数据获取失败
                            if (minuteLoading) minuteLoading.textContent = '暂无分时数据';
                        }
                    })
                    .catch(err => {
                        console.log('分时数据加载失败:', err);
                        const minuteLoading = document.getElementById('minuteLoading');
                        if (minuteLoading) minuteLoading.textContent = '分时数据加载失败';
                    });

            } catch (error) {
                indexCard.innerHTML = `<div class="error">指数加载失败</div>`;
            }
        }

        function generateMockFlowData() {
            const times = [];
            const netFlows = [];

            let cumulative = 0;
            for (let i = 0; i < 46; i++) {
                const hour = i < 19 ? 9 : 13;
                const minute = i < 19 ? 30 + (i * 5) : (i - 19) * 5;
                if (i === 19) {
                    times.push('11:30');
                    netFlows.push(cumulative);
                    continue;
                }
                if (hour === 13 && minute > 55) break;

                const timeStr = `${hour}:${minute.toString().padStart(2, '0')}`;
                times.push(timeStr);

                const change = (Math.random() - 0.5) * 100;
                cumulative += change;
                netFlows.push(Math.round(cumulative));
            }

            return { times, netFlows };
        }

        async function loadMoneyFlowData() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">正在加载数据...</div>';

            try {
                const response = await fetch(`/api/money-flow/${currentPage}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let totalInflow = 0;
                    let totalOutflow = 0;

                    result.data.forEach(item => {
                        const inflowVal = parseFloat(item.inflow.replace('亿', '')) || 0;
                        const outflowVal = parseFloat(item.outflow.replace('亿', '')) || 0;
                        totalInflow += inflowVal;
                        totalOutflow += outflowVal;
                    });

                    const netFlow = (totalInflow - totalOutflow).toFixed(2);

                    let html = `
                        <div class="stats-cards">
                            <div class="stat-card">
                                <h3>总流入</h3>
                                <div class="value positive">${totalInflow.toFixed(2)}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>总流出</h3>
                                <div class="value negative">${totalOutflow.toFixed(2)}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>净流入</h3>
                                <div class="value ${netFlow >= 0 ? 'positive' : 'negative'}">${netFlow >= 0 ? '+' : ''}${netFlow}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>板块数量</h3>
                                <div class="value">${result.data.length}</div>
                            </div>
                        </div>
                        <div class="data-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>板块名称</th>
                                        <th>涨跌幅</th>
                                        <th>流入</th>
                                        <th>流出</th>
                                        <th>净流入</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    result.data.forEach(item => {
                        const changeClass = item.change.startsWith('+') ? 'change-up' : 'change-down';
                        html += `
                            <tr>
                                <td>${item.rank}</td>
                                <td>${item.name}</td>
                                <td class="${changeClass}">${item.change}</td>
                                <td>${item.inflow}</td>
                                <td>${item.outflow}</td>
                                <td class="${changeClass}">${item.net_inflow}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table></div>';
                    contentArea.innerHTML = html;
                } else {
                    contentArea.innerHTML = '<div class="error">暂无数据，请稍后重试</div>';
                }
            } catch (error) {
                contentArea.innerHTML = `<div class="error">数据加载失败: ${error.message}</div>`;
            }
        }

        async function loadAllData() {
            loadIndexWithChart();
            loadMoneyFlowData();
        }

        // 左侧导航切换页面
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                this.classList.add('active');
                const page = this.getAttribute('data-page');
                document.getElementById('page-money-flow').style.display = page === 'money-flow' ? 'block' : 'none';
                document.getElementById('page-stock-pick').style.display = page === 'stock-pick' ? 'block' : 'none';
                if (page === 'money-flow') loadAllData();
            });
        });

        // 股票搜索
        async function searchStock() {
            const keyword = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('searchResults');
            if (!keyword) { resultsDiv.innerHTML = '<div style="text-align:center;color:#666;padding:40px;">请输入股票名称或代码</div>'; return; }
            resultsDiv.innerHTML = '<div class="loading">搜索中...</div>';
            try {
                const res = await fetch('/api/search-stock?q=' + encodeURIComponent(keyword));
                const data = await res.json();
                if (data.success && data.data.length > 0) {
                    let html = '<div style="display:flex;flex-direction:column;gap:8px;">';
                    data.data.forEach(s => {
                        html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 15px;background:#1a1a2e;border-radius:6px;border:1px solid #0f3460;">
                            <div><span style="color:#fff;font-weight:bold;">${s.name}</span> <span style="color:#888;font-size:12px;">${s.code}</span></div>
                            <div><span style="color:#888;font-size:12px;">${s.market === '1' ? '沪' : s.market === '0' ? '深' : ''}</span></div>
                        </div>`;
                    });
                    html += '</div>';
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = '<div style="text-align:center;color:#666;padding:40px;">未找到相关股票</div>';
                }
            } catch(e) {
                resultsDiv.innerHTML = '<div class="error">搜索失败</div>';
            }
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentPage = this.getAttribute('data-page');
                loadMoneyFlowData();
            });
        });

        loadAllData();

        // 自动刷新：每10秒更新实时数据
        async function refreshRealtimeData() {
            try {
                // 更新上证指数价格
                const idxRes = await fetch('/api/major-indices');
                const idxData = await idxRes.json();
                if (idxData.success && idxData.data.length > 0) {
                    const d = idxData.data[0];
                    const isUp = d.change.startsWith('+');
                    const color = isUp ? '#e94560' : '#4ade80';
                    const priceEl = document.querySelector('.index-price');
                    const changeEl = document.querySelector('.index-change');
                    if (priceEl) { priceEl.textContent = d.price; priceEl.style.color = color; }
                    if (changeEl) { changeEl.textContent = d.change + ' ' + d.change_value; changeEl.className = 'index-change ' + (isUp ? 'up' : 'down'); }
                }

                // 更新分时走势
                const minRes = await fetch('/api/sh000001-minute');
                const minData = await minRes.json();
                if (minuteChart && minData.success && minData.data.times) {
                    minuteChart.data.labels = minData.data.times;
                    minuteChart.data.datasets[0].data = minData.data.prices;
                    minuteChart.data.datasets[1].data = Array(minData.data.times.length).fill(minData.data.preClose);
                    const mPreClose = minData.data.preClose || 0;
                    let mMaxDev = 0;
                    minData.data.prices.forEach(p => { const d = Math.abs(p - mPreClose); if (d > mMaxDev) mMaxDev = d; });
                    mMaxDev = Math.max(mMaxDev * 1.15, mPreClose * 0.005);
                    minuteChart.options.scales.y.min = mPreClose - mMaxDev;
                    minuteChart.options.scales.y.max = mPreClose + mMaxDev;
                    const isUp2 = parseFloat(minData.data.change) >= 0;
                    const lc = isUp2 ? '#e94560' : '#4ade80';
                    minuteChart.data.datasets[0].borderColor = lc;
                    minuteChart.data.datasets[0].backgroundColor = (ctx => { const g = ctx.chart.ctx.createLinearGradient(0,0,0,180); g.addColorStop(0, isUp2 ? 'rgba(233,69,96,0.2)' : 'rgba(74,222,128,0.2)'); g.addColorStop(1, 'rgba(26,26,46,0)'); return g; });
                    minuteChart.update('none');
                }

                // 更新资金流
                const flowRes = await fetch('/api/market-fund-flow');
                const flowData = await flowRes.json();
                if (turnoverChart && flowData.success && flowData.data.times) {
                    turnoverChart.data.labels = flowData.data.times;
                    turnoverChart.data.datasets[0].data = flowData.data.flows;
                    turnoverChart.data.datasets[1].data = flowData.data.flows_mid || [];
                    turnoverChart.data.datasets[2].data = flowData.data.flows_small || [];
                    turnoverChart.data.datasets[3].data = Array(flowData.data.times.length).fill(0);
                    turnoverChart.update('none');
                    // 更新 header 大盘资金净流入
                    const flows = flowData.data.flows;
                    const totalFlow = flows.length > 0 ? flows[flows.length - 1] : 0;
                    const headerDiv = document.querySelector('#marketBreadth');
                    if (headerDiv && headerDiv.nextElementSibling) {
                        const fc = totalFlow >= 0 ? '#e94560' : '#4ade80';
                        headerDiv.nextElementSibling.innerHTML = `大盘净流入: <span style="color:${fc};">${totalFlow >= 0 ? '+' : ''}${totalFlow.toFixed(2)}亿</span>`;
                    }
                }

                // 更新恐慌/风险指数
                const fearRes = await fetch('/api/fear-index');
                const fearData = await fearRes.json();
                if (fearData.success && fearData.data) {
                    const fd = fearData.data;
                    const fDiv = document.getElementById('fearIndex');
                    if (fDiv) {
                        fDiv.querySelector('div:nth-child(1)').textContent = fd.score;
                        fDiv.querySelector('div:nth-child(1)').style.color = fd.color;
                        fDiv.querySelector('div:nth-child(2)').textContent = fd.level;
                        fDiv.querySelector('div:nth-child(2)').style.color = fd.color;
                        const ptr = fDiv.querySelector('div[style*="position:absolute"]');
                        if (ptr) ptr.style.left = fd.score + '%';
                    }
                    // 涨跌数据
                    const bDiv = document.getElementById('marketBreadth');
                    if (bDiv) bDiv.innerHTML = `涨<span style="color:#e94560;">${fd.rise}</span> 跌<span style="color:#4ade80;">${fd.fall}</span> 平<span style="color:#888;">${fd.flat}</span>`;
                }

                const riskRes = await fetch('/api/risk-index');
                const riskData = await riskRes.json();
                if (riskData.success && riskData.data) {
                    const rd = riskData.data;
                    const rDiv = document.getElementById('riskIndex');
                    if (rDiv && rDiv.children[0]) {
                        rDiv.children[0].textContent = rd.score;
                        rDiv.children[0].style.color = rd.color;
                        if (rDiv.children[1]) { rDiv.children[1].textContent = rd.level; rDiv.children[1].style.color = rd.color; }
                        const ptr = rDiv.querySelector('div[style*="position:absolute"]');
                        if (ptr) ptr.style.left = rd.score + '%';
                    }
                }
            } catch(e) { console.log('Auto refresh error:', e); }
        }

        setInterval(refreshRealtimeData, 10000);
    </script>
</body>
</html>
