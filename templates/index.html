<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑫多多</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>鑫多多</h1>
            </div>
            <div class="nav-section">
                <div class="nav-item active" data-page="money-flow">
                    <span class="nav-icon">💰</span>
                    <span>资金流向</span>
                </div>
                <div class="nav-item" data-page="stock-pick">
                    <span class="nav-icon">🔍</span>
                    <span>选股</span>
                </div>
                <div class="nav-item" data-page="watchlist">
                    <span class="nav-icon">⭐</span>
                    <span>自选股</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <!-- 资金流向页面 -->
            <div id="page-money-flow">
                <div class="page-header">
                    <h1 class="page-title">💰 资金流向</h1>
                    <button class="refresh-btn" onclick="loadAllData()">🔄 刷新数据</button>
                </div>

                <div class="index-card" id="index-card">
                    <div class="loading">正在加载上证指数...</div>
                </div>

                <div class="tabs">
                    <button class="tab-btn active" data-page="concept">
                        💡 概念板块
                    </button>
                    <button class="tab-btn" data-page="industry">
                        🏭 行业板块
                    </button>
                    <button class="tab-btn" data-page="index">
                        📊 指数板块
                    </button>
                </div>

                <div id="content-area">
                    <div class="loading">正在加载数据...</div>
                </div>
            </div>

            <!-- 自选股页面 -->
            <div id="page-watchlist" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">⭐ 自选股</h1>
                </div>
                <div class="index-card" style="padding:30px;">
                    <div style="text-align:center; color:#666; padding:40px;">功能开发中...</div>
                </div>
            </div>

            <!-- 选股页面 -->
            <div id="page-stock-pick" style="display:none;">
                <div class="page-header">
                    <h1 class="page-title">🔍 选股</h1>
                </div>
                <div class="index-card" style="padding:30px;">
                    <div style="max-width:600px; margin:0 auto; position:relative;">
                        <div style="display:flex; gap:10px; margin-bottom:8px;">
                            <input id="searchInput" type="text" autocomplete="off" placeholder="输入股票名称或代码..." style="flex:1; padding:12px 16px; border:1px solid #0f3460; border-radius:8px; background:#1a1a2e; color:#fff; font-size:15px; outline:none;" oninput="debounceSearch()" onkeydown="handleSearchKey(event)" onfocus="debounceSearch()" onblur="setTimeout(()=>{if(!document.querySelector('#searchResults:hover')){document.getElementById('searchResults').innerHTML='';searchResultsData=[];selectedSearchIdx=-1;}},200)">
                        </div>
                        <div id="searchResults" style="position:absolute; left:0; right:0; top:56px; z-index:10; background:#16213e; border-radius:8px; box-shadow:0 8px 24px rgba(0,0,0,0.5);">
                            <div style="text-align:center; color:#666; padding:12px 0;">输入股票名称或代码开始搜索</div>
                        </div>
                    </div>
                    <div id="pickedStocks" style="margin-top:8px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 'concept';
        let minuteChart = null;
        let turnoverChart = null;
        let marginChart = null;
        let fullMinuteSlots = [];
        let fullFlowSlots = [];

        function generateFlowSlots() {
            const slots = [];
            for (let h = 9, m = 30; h < 12; ) {
                slots.push(String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'));
                m++;
                if (m >= 60) { h++; m -= 60; }
                if (h === 11 && m > 30) break;
            }
            for (let h = 13, m = 0; h < 15 || (h === 15 && m === 0); ) {
                slots.push(String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0'));
                m++;
                if (m >= 60) { h++; m -= 60; }
                if (h === 15 && m > 0) break;
            }
            return slots;
        }

        function mapToSlots(fullSlots, dataTimes, dataValues) {
            const result = new Array(fullSlots.length).fill(null);
            const indexMap = {};
            for (let i = 0; i < fullSlots.length; i++) {
                indexMap[fullSlots[i]] = i;
            }
            for (let i = 0; i < dataTimes.length; i++) {
                const idx = indexMap[dataTimes[i]];
                if (idx !== undefined && idx >= 0) {
                    result[idx] = dataValues[i];
                }
            }
            return result;
        }

        // 同 mapToSlots，但 13:00 若无数据则用 11:30 的值填充，避免午休折线断开
        function mapAndFill(fullSlots, dataTimes, dataValues) {
            const result = mapToSlots(fullSlots, dataTimes, dataValues);
            const idx13 = fullSlots.indexOf('13:00');
            if (idx13 > 0 && result[idx13] === null) {
                for (let i = idx13 - 1; i >= 0; i--) {
                    if (result[i] !== null) {
                        result[idx13] = result[i];
                        break;
                    }
                }
            }
            return result;
        }

        function getFearSummary(score) {
            if (score <= 30) return '市场情绪平稳，无明显恐慌信号。';
            if (score <= 50) return '市场出现轻度恐慌，需关注后续走势。';
            if (score <= 65) return '恐慌情绪明显，短线抛压加大。';
            if (score <= 80) return '市场高度恐慌，资金避险情绪浓厚。';
            return '市场极度恐慌，可能出现非理性抛售。';
        }
        function getRiskSummary(score) {
            if (score <= 20) return '市场低风险区间，可适当积极布局。';
            if (score <= 40) return '市场风险较低，注意仓位管理。';
            if (score <= 60) return '市场中等风险，建议控制仓位、择优参与。';
            if (score <= 80) return '市场风险较高，建议谨慎操作。';
            return '市场高风险，建议降低仓位、规避风险。';
        }

        function formatTurnover(value) {
            if (value >= 10000) {
                return (value / 10000).toFixed(2) + '万亿';
            }
            return value.toFixed(2) + '亿';
        }

        const fearExplain = '<div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05); font-size:10px; color:#555; line-height:1.5;">' +
            '沪深指数平均涨跌=上证+深证涨幅均值 | 30分钟跌速=日内最大30分跌幅 | ' +
            '日内回撤=最高到最低跌幅 | 振幅=(高-低)/昨收 | ' +
            '红盘率=上涨家数占比 | 主力净流入=沪深主力累计' +
            '</div>';
        const riskExplain = '<div style="margin-top:8px; padding-top:6px; border-top:1px solid rgba(255,255,255,0.05); font-size:10px; color:#555; line-height:1.5;">' +
            '融资余额5日=两市融资近5日变动 | 两融余额10日=融资+融券近10日变动 | ' +
            '融资活跃度=当日买入vs20日均值 | 5/10日涨跌=沪深均值 | ' +
            '回撤=20日最大跌幅 | 波动率=10日日收益率标准差 | ' +
            '情绪面=恐慌指数+红盘率得分 | 涨跌结构=涨跌家数差得分' +
            '</div>';

        async function loadIndexWithChart() {
            const indexCard = document.getElementById('index-card');
            indexCard.innerHTML = '<div class="loading">正在加载上证指数...</div>';

            try {
                const indexRes = await fetch('/api/major-indices');
                const indexResult = await indexRes.json();

                let indexData = null;
                if (indexResult.success && indexResult.data.length > 0) {
                    indexData = indexResult.data[0];
                }

                if (!indexData) {
                    indexCard.innerHTML = '<div class="error">暂无指数数据</div>';
                    return;
                }

                const isUp = indexData.change.startsWith('+');
                const changeClass = isUp ? 'up' : 'down';
                const lineColor = isUp ? '#e94560' : '#4ade80';
                const gradientColor = isUp ? 'rgba(233, 69, 96, 0.2)' : 'rgba(74, 222, 128, 0.2)';

                indexCard.innerHTML = `
                        <div class="index-header">
                            <div class="index-info">
                                <span class="index-name">${indexData.name}</span>
                                <span class="index-price" style="color: ${lineColor};">${indexData.price}</span>
                                <span class="index-change ${changeClass}">${indexData.change} ${indexData.change_value}</span>
                                <span id="marketBreadth" style="font-size: 12px; color: #888;"></span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 30px; font-size: 13px; color: #888; margin-bottom: 15px;">
                            <span>加载中...</span>
                        </div>
                        <div style="display: flex; gap: 15px;">
                            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px;">
                                <div class="chart-box" style="position:relative;">
                                    <canvas id="minuteChart"></canvas>
                                    <div id="minuteLoading" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;pointer-events:none;">加载中...</div>
                                    <div class="chart-title">分时走势</div>
                                </div>
                                <div class="chart-box">
                                    <canvas id="turnoverChart"></canvas>
                                    <div class="chart-title">大盘净资金流入</div>
                                </div>
                                <div class="chart-box">
                                    <canvas id="marginChart"></canvas>
                                    <div class="chart-title">融资融券</div>
                                </div>
                            </div>
                            <div style="width: 220px; min-width: 220px; display: flex; flex-direction: column;">
                                <div class="index-card" style="height: 100%; padding: 18px; display: flex; flex-direction: column;">
                                    <div class="chart-title" style="margin-bottom: 12px;">市场风险指数</div>
                                    <div id="riskIndex" style="display: flex; flex-direction: column; align-items: center; flex: 1;">
                                        <div class="loading">加载中...</div>
                                    </div>
                                </div>
                            </div>
                            <div style="width: 220px; min-width: 220px; display: flex; flex-direction: column;">
                                <div class="index-card" style="height: 100%; padding: 18px; display: flex; flex-direction: column;">
                                    <div class="chart-title" style="margin-bottom: 12px;">市场恐慌指数</div>
                                    <div id="fearIndex" style="display: flex; flex-direction: column; align-items: center; flex: 1;">
                                        <div class="loading">加载中...</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;

                // 等待真实分时数据到达后再绘制图表，避免显示直线 mock 数据

                fetch('/api/turnover-minute')
                    .then(res => res.json())
                    .then(turnoverResult => {
                        const headerDiv1 = indexCard.querySelector('div[style*="gap: 30px"]');
                        let turnoverHeader = {};
                        if (turnoverResult.success && turnoverResult.data.header) {
                            turnoverHeader = turnoverResult.data.header;
                        }
                        let headerInfo = '';
                        if (turnoverHeader && turnoverHeader.turnover) {
                            const todayTurnover = turnoverHeader.turnover / 100000000;
                            const yesterdayTurnover = turnoverHeader.turnover_pre / 100000000;
                            const change = turnoverHeader.turnover_change / 100000000;
                            const changePct = yesterdayTurnover ? (change / yesterdayTurnover * 100) : 0;
                            headerInfo = `
                                <div style="display: flex; gap: 30px; font-size: 13px; color: #888;">
                                    <span>当日成交额: <span id="todayTurnover" style="color: #fff;">${todayTurnover.toFixed(2)}亿</span></span>
                                    <span>昨日成交额: <span id="yesterdayTurnover" style="color: #fff;">${yesterdayTurnover.toFixed(2)}亿</span></span>
                                    <span>较昨日变动: <span id="turnoverChange" style="color: ${change >= 0 ? '#e94560' : '#4ade80'};">${change >= 0 ? '+' : ''}${change.toFixed(2)}亿 (${changePct >= 0 ? '+' : ''}${changePct.toFixed(1)}%)</span></span>
                                </div>
                            `;
                        }
                        if (headerDiv1) headerDiv1.innerHTML = headerInfo || '<span style="color:#888;">暂无成交额数据</span>';
                    })
                    .catch(err => console.log('成交额数据加载失败:', err));

                fetch('/api/market-fund-flow')
                    .then(res => res.json())
                    .then(flowResult => {
                        let flowTimes = [];
                        let flows = [];
                        let flowsMid = [];
                        let flowsSmall = [];
                        let totalFlow = 0;

                        if (flowResult.success && flowResult.data.times) {
                            fullFlowSlots = generateFlowSlots();
                            flowTimes = fullFlowSlots;
                            flows = mapAndFill(fullFlowSlots, flowResult.data.times, flowResult.data.flows);
                            flowsMid = mapAndFill(fullFlowSlots, flowResult.data.times, flowResult.data.flows_mid || []);
                            flowsSmall = mapAndFill(fullFlowSlots, flowResult.data.times, flowResult.data.flows_small || []);
                            totalFlow = flowResult.data.flows.length > 0 ? flowResult.data.flows[flowResult.data.flows.length - 1] : 0;
                        }

                        // 更新 header 追加大盘资金净流入
                        const headerDiv2 = indexCard.querySelector('div[style*="gap: 30px"]');
                        if (headerDiv2 && flowResult.success) {
                            const flowColor = totalFlow >= 0 ? '#e94560' : '#4ade80';
                            headerDiv2.innerHTML += `<span>大盘资金净流入: <span id="netFlowValue" style="color: ${flowColor};">${totalFlow >= 0 ? '+' : ''}${totalFlow.toFixed(2)}亿</span></span>`;
                        }

                        const ctxTurnover = document.getElementById('turnoverChart').getContext('2d');
                        if (turnoverChart) turnoverChart.destroy();

                        turnoverChart = new Chart(ctxTurnover, {
                            type: 'line',
                            data: {
                                labels: flowTimes,
                                datasets: [{
                                    data: flows,
                                    borderColor: '#fbbf24',
                                    backgroundColor: function(context) {
                                        const chart = context.chart;
                                        const ctx = chart.ctx;
                                        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
                                        gradient.addColorStop(0, 'rgba(233, 69, 96, 0.25)');
                                        gradient.addColorStop(0.5, 'rgba(233, 69, 96, 0.05)');
                                        gradient.addColorStop(0.5, 'rgba(74, 222, 128, 0.05)');
                                        gradient.addColorStop(1, 'rgba(74, 222, 128, 0.25)');
                                        return gradient;
                                    },
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: true
                                }, {
                                    data: flowsMid,
                                    borderColor: '#a78bfa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [3, 5],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false
                                }, {
                                    data: flowsSmall,
                                    borderColor: '#60a5fa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [4, 3],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false
                                }, {
                                    data: Array(flowTimes.length).fill(0),
                                    borderColor: 'rgba(255,255,255,0.3)',
                                    borderWidth: 1,
                                    borderDash: [4, 4],
                                    pointRadius: 0,
                                    fill: false
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                layout: { padding: { left: 10, right: 10 } },
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        mode: 'index', intersect: false,
                                        backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#ddd', borderColor: '#0f3460', borderWidth: 1,
                                        callbacks: { label: function(context) { const v = context.raw; if (context.datasetIndex === 3) return ''; const labels = ['大盘资金', '中单', '散户']; return labels[context.datasetIndex] + ': ' + (v >= 0 ? '+' : '') + v.toFixed(2) + '亿'; } }
                                    }
                                },
                                scales: {
                                    x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', autoSkip: false, maxRotation: 0, font: { size: 10 }, callback: function(value, index) { const label = this.getLabelForValue(value); if (!label) return ''; if (label === '11:30') return ''; if (label === '09:30' || label === '13:00' || label === '15:00') return label; const parts = label.split(':'); const h = parseInt(parts[0]); const min = parseInt(parts[1]); if (h < 12) return ((min + 30) % 20 === 0) ? label : ''; else return (min % 20 === 0) ? label : ''; } } },
                                    y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', font: { size: 10 }, callback: function(value) { return value.toFixed(2) + '亿'; } }, afterFit: function(scale) { scale.width = 65; } }
                                },
                                interaction: { mode: 'index', intersect: false }
                            }
                        });
                    })
                    .catch(err => console.log('资金流数据加载失败:', err));

                fetch('/api/margin-trading')
                    .then(res => res.json())
                    .then(marginResult => {
                        const ctxMargin = document.getElementById('marginChart').getContext('2d');
                        if (marginChart) marginChart.destroy();

                        let marginDates = [];
                        let rzBalances = [];
                        let rqBalances = [];
                        let totalBalances = [];
                        let buyAmounts = [];

                        if (marginResult.success && marginResult.data.dates) {
                            marginDates = marginResult.data.dates;
                            rzBalances = marginResult.data.rz_balances;
                            rqBalances = marginResult.data.rq_balances;
                            totalBalances = marginResult.data.total_balances;
                            buyAmounts = marginResult.data.buy_amounts;
                        }

                        marginChart = new Chart(ctxMargin, {
                            type: 'line',
                            data: {
                                labels: marginDates,
                                datasets: [{
                                    label: '两融余额',
                                    data: totalBalances,
                                    borderColor: '#fbbf24',
                                    backgroundColor: 'rgba(251,191,36,0.08)',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: true,
                                    yAxisID: 'y'
                                }, {
                                    label: '融资余额',
                                    data: rzBalances,
                                    borderColor: '#e94560',
                                    backgroundColor: 'transparent',
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y'
                                }, {
                                    label: '融券余额',
                                    data: rqBalances,
                                    borderColor: '#4ade80',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y1'
                                }, {
                                    label: '融资买入额',
                                    data: buyAmounts,
                                    borderColor: '#60a5fa',
                                    backgroundColor: 'transparent',
                                    borderWidth: 1.5,
                                    borderDash: [4, 3],
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: false,
                                    yAxisID: 'y1'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                layout: { padding: { left: 10, right: 10 } },
                                plugins: {
                                    legend: { display: true, position: 'top', labels: { color: '#888', font: { size: 10 }, boxWidth: 12, padding: 5 } },
                                    tooltip: {
                                        mode: 'index', intersect: false,
                                        backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#ddd', borderColor: '#0f3460', borderWidth: 1,
                                        callbacks: { label: ctx => ctx.dataset.label + ': ' + ctx.raw.toFixed(2) + '亿' }
                                    }
                                },
                                scales: {
                                    x: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#888', font: { size: 10 }, maxTicksLimit: 14 } },
                                    y: {
                                        type: 'linear', position: 'left',
                                        grid: { color: 'rgba(255,255,255,0.1)' },
                                        ticks: { color: '#e94560', font: { size: 10 }, callback: v => (v / 10000).toFixed(2) + '万亿' },
                                        afterFit: function(scale) { scale.width = 65; }
                                    },
                                    y1: {
                                        type: 'linear', position: 'right',
                                        grid: { display: false },
                                        ticks: { color: '#4ade80', font: { size: 10 }, callback: v => v.toFixed(0) + '亿' },
                                        afterFit: function(scale) { scale.width = 50; }
                                    }
                                },
                                interaction: { mode: 'index', intersect: false }
                            }
                        });
                    })
                    .catch(err => console.log('融资融券数据加载失败:', err));

                fetch('/api/fear-index')
                    .then(res => res.json())
                    .then(fearResult => {
                        const fearDiv = document.getElementById('fearIndex');
                        if (fearResult.success && fearResult.data) {
                            const d = fearResult.data;
                            // 涨跌数据放到 header
                            const breadthDiv = document.getElementById('marketBreadth');
                            if (breadthDiv) {
                                breadthDiv.innerHTML = `涨<span style="color:#e94560;">${d.rise}</span> 跌<span style="color:#4ade80;">${d.fall}</span> 平<span style="color:#888;">${d.flat}</span>`;
                            }
                            // 恐慌指数卡片
                            const fMetrics = '<div style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:#666; line-height:1.7;">' +
                                '<div>沪深指数平均涨跌: <span style="color:#ccc;">' + (d.avg_index_change != null ? (d.avg_index_change >= 0 ? '+' : '') + d.avg_index_change.toFixed(2) + '%' : '--') + '</span></div>' +
                                '<div>30分钟最大跌速: <span style="color:#ccc;">' + (d.max_30m_drop != null ? d.max_30m_drop.toFixed(2) + '%' : '--') + '</span></div>' +
                                '<div>日内最大回撤: <span style="color:#ccc;">' + (d.max_drawdown != null ? d.max_drawdown.toFixed(2) + '%' : '--') + '</span></div>' +
                                '<div>上证振幅: <span style="color:#ccc;">' + (d.amplitude != null ? d.amplitude.toFixed(2) + '%' : '--') + '</span></div>' +
                                '<div>全A红盘率: <span style="color:#ccc;">' + (d.red_ratio != null ? d.red_ratio.toFixed(1) + '%' : '--') + '</span></div>' +
                                '<div>下跌家数占比: <span style="color:#ccc;">' + (d.down_ratio != null ? d.down_ratio.toFixed(1) + '%' : '--') + '</span></div>' +

        function generateMockFlowData() {
            const times = [];
            const netFlows = [];

            let cumulative = 0;
            for (let i = 0; i < 46; i++) {
                const hour = i < 19 ? 9 : 13;
                const minute = i < 19 ? 30 + (i * 5) : (i - 19) * 5;
                if (i === 19) {
                    times.push('11:30');
                    netFlows.push(cumulative);
                    continue;
                }
                if (hour === 13 && minute > 55) break;

                const timeStr = `${hour}:${minute.toString().padStart(2, '0')}`;
                times.push(timeStr);

                const change = (Math.random() - 0.5) * 100;
                cumulative += change;
                netFlows.push(Math.round(cumulative));
            }

            return { times, netFlows };
        }

        // 股票类型判断
        function getStockType(code, market) {
            const c = (code || '').toString();
            const m = (market || '').toString();
            // 沪市
            if (m === '1' || m === '2') {
                if (/^68/.test(c)) return '科创';
                if (/^60|^900/.test(c)) return '沪A';
                if (/^51[0-9]/.test(c)) return '沪ETF';
                if (/^5[0-9]/.test(c)) return '沪基';
                if (/^11/.test(c)) return '沪债';
                return '沪市';
            }
            // 深市
            if (m === '0') {
                if (/^30[04]/.test(c)) return '创业';
                if (/^00[024]|^002|^003/.test(c)) return '深A';
                if (/^15[0-9]/.test(c)) return '深ETF';
                if (/^1[0-9]/.test(c)) return '深基';
                if (/^12/.test(c)) return '深债';
                return '深市';
            }
            // 北交所
            if (m === '90') return '北交所';
            if (m === '116') return '港股';
            if (m === '106') return '美股';
            if (/^1[0-5]/.test(m) && parseInt(m) >= 105) return '境外';
            return '';
        }

        function handleSearchKey(e) {
            const items = document.querySelectorAll('#searchResults .stock-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                selectedSearchIdx = Math.min(selectedSearchIdx + 1, items.length - 1);
                updateSearchHighlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                selectedSearchIdx = Math.max(selectedSearchIdx - 1, 0);
                updateSearchHighlight(items);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (selectedSearchIdx >= 0 && selectedSearchIdx < items.length) {
                    items[selectedSearchIdx].click();
                }
            }
        }

        function updateSearchHighlight(items) {
            items.forEach((item, i) => {
                item.style.background = i === selectedSearchIdx ? '#0f3460' : '#1a1a2e';

            return (v/1e4).toFixed(2) + '万';

        loadAllData();

        // 自动刷新：开盘期间每10秒更新实时数据
        function isInTradingHours() {
            const now = new Date();
            const t = now.getHours() * 60 + now.getMinutes();
            return (t >= 540 && t <= 700) || (t >= 770 && t <= 930);
            // 09:00-11:40, 12:50-15:30
        }

        async function refreshRealtimeData() {
            if (!isInTradingHours()) return;
            try {
                // 更新上证指数价格
                const idxRes = await fetch('/api/major-indices');
                const idxData = await idxRes.json();
                if (idxData.success && idxData.data.length > 0) {
                    const d = idxData.data[0];
                    const isUp = d.change.startsWith('+');
                    const color = isUp ? '#e94560' : '#4ade80';
                    const priceEl = document.querySelector('.index-price');
                    const changeEl = document.querySelector('.index-change');
                    if (priceEl) { priceEl.textContent = d.price; priceEl.style.color = color; }
                    if (changeEl) { changeEl.textContent = d.change + ' ' + d.change_value; changeEl.className = 'index-change ' + (isUp ? 'up' : 'down'); }
                }

                // 更新分时走势
                const minRes = await fetch('/api/sh000001-minute');
                const minData = await minRes.json();
                if (minuteChart && minData.success && minData.data.times && fullMinuteSlots.length > 0) {
                    minuteChart.data.datasets[0].data = mapAndFill(fullMinuteSlots, minData.data.times, minData.data.prices);
                    minuteChart.data.datasets[1].data = Array(fullMinuteSlots.length).fill(minData.data.preClose);
                    const mPreClose = minData.data.preClose || 0;
                    let mMaxDev = 0;
                    minData.data.prices.forEach(p => { const d = Math.abs(p - mPreClose); if (d > mMaxDev) mMaxDev = d; });
                    mMaxDev = Math.max(mMaxDev * 1.15, mPreClose * 0.005);
                    minuteChart.options.scales.y.min = mPreClose - mMaxDev;
                    minuteChart.options.scales.y.max = mPreClose + mMaxDev;
                    const isUp2 = parseFloat(minData.data.change) >= 0;
                    const lc = isUp2 ? '#e94560' : '#4ade80';
                    minuteChart.data.datasets[0].borderColor = lc;
                    minuteChart.data.datasets[0].backgroundColor = (ctx => { const g = ctx.chart.ctx.createLinearGradient(0,0,0,180); g.addColorStop(0, isUp2 ? 'rgba(233,69,96,0.2)' : 'rgba(74,222,128,0.2)'); g.addColorStop(1, 'rgba(26,26,46,0)'); return g; });
                    minuteChart.update('none');
                }

                // 更新成交额 header (只改文字，不重建 DOM)
                const turnoverRes = await fetch('/api/turnover-minute');
                const turnoverData = await turnoverRes.json();
                if (turnoverData.success && turnoverData.data.header && turnoverData.data.header.turnover) {
                    const th = turnoverData.data.header;
                    const tChange = th.turnover_change / 100000000;
                    const elToday = document.getElementById('todayTurnover');
                    const elYesterday = document.getElementById('yesterdayTurnover');
                    const elChange = document.getElementById('turnoverChange');
                    if (elToday) elToday.textContent = (th.turnover / 100000000).toFixed(2) + '亿';
                    if (elYesterday) elYesterday.textContent = (th.turnover_pre / 100000000).toFixed(2) + '亿';
                    if (elChange) {
                        const tPct = th.turnover_pre ? (tChange / (th.turnover_pre / 100000000) * 100) : 0;
                        elChange.textContent = (tChange >= 0 ? '+' : '') + tChange.toFixed(2) + '亿 (' + (tPct >= 0 ? '+' : '') + tPct.toFixed(1) + '%)';
                        elChange.style.color = tChange >= 0 ? '#e94560' : '#4ade80';
                    }
                }

                // 更新资金流
                const flowRes = await fetch('/api/market-fund-flow');
                const flowData = await flowRes.json();
                if (turnoverChart && flowData.success && flowData.data.times && fullFlowSlots.length > 0) {
                    turnoverChart.data.datasets[0].data = mapAndFill(fullFlowSlots, flowData.data.times, flowData.data.flows);
                    turnoverChart.data.datasets[1].data = mapAndFill(fullFlowSlots, flowData.data.times, flowData.data.flows_mid || []);
                    turnoverChart.data.datasets[2].data = mapAndFill(fullFlowSlots, flowData.data.times, flowData.data.flows_small || []);
                    turnoverChart.data.datasets[3].data = Array(fullFlowSlots.length).fill(0);
                    turnoverChart.update('none');
                    // 更新大盘净流入 (只改文字)
                    const flows = flowData.data.flows;
                    const totalFlow = flows.length > 0 ? flows[flows.length - 1] : 0;
                    const elFlow = document.getElementById('netFlowValue');
                    if (elFlow) {
                        elFlow.textContent = (totalFlow >= 0 ? '+' : '') + totalFlow.toFixed(2) + '亿';
                        elFlow.style.color = totalFlow >= 0 ? '#e94560' : '#4ade80';
                    }
                }

                // 更新恐慌/风险指数
                const fearRes = await fetch('/api/fear-index');
                const fearData = await fearRes.json();
                if (fearData.success && fearData.data) {
                    const fd = fearData.data;
                    const fDiv = document.getElementById('fearIndex');
                    if (fDiv) {
                        fDiv.querySelector('div:nth-child(1)').textContent = fd.score;
                        fDiv.querySelector('div:nth-child(1)').style.color = fd.color;
                        fDiv.querySelector('div:nth-child(2)').textContent = fd.level;
                        fDiv.querySelector('div:nth-child(2)').style.color = fd.color;
                        const ptr = fDiv.querySelector('div[style*="position:absolute"]');
                        if (ptr) ptr.style.left = fd.score + '%';
                        // 更新总结和指标
                        const fConc = document.getElementById('fearConclusion');
                        if (fConc) fConc.textContent = getFearSummary(fd.score);
                        const fMet = document.getElementById('fearMetrics');
                        if (fMet) fMet.innerHTML = '<div style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:#666; line-height:1.7;">' +
                            '<div>沪深指数平均涨跌: <span style="color:#ccc;">' + (fd.avg_index_change != null ? (fd.avg_index_change >= 0 ? '+' : '') + fd.avg_index_change.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>30分钟最大跌速: <span style="color:#ccc;">' + (fd.max_30m_drop != null ? fd.max_30m_drop.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>日内最大回撤: <span style="color:#ccc;">' + (fd.max_drawdown != null ? fd.max_drawdown.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>上证振幅: <span style="color:#ccc;">' + (fd.amplitude != null ? fd.amplitude.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>全A红盘率: <span style="color:#ccc;">' + (fd.red_ratio != null ? fd.red_ratio.toFixed(1) + '%' : '--') + '</span></div>' +
                            '<div>下跌家数占比: <span style="color:#ccc;">' + (fd.down_ratio != null ? fd.down_ratio.toFixed(1) + '%' : '--') + '</span></div>' +
                            '<div>主力资金净流入: <span style="color:#ccc;">' + (fd.main_net != null ? (fd.main_net >= 0 ? '+' : '') + fd.main_net.toFixed(2) + '亿' : '--') + '</span></div>' +
                            '<div>从低点反弹: <span style="color:#ccc;">' + (fd.rebound != null ? (fd.rebound >= 0 ? '+' : '') + fd.rebound.toFixed(2) + '%' : '--') + '</span></div>' +
                            '</div>' + fearExplain;
                    }
                    // 涨跌数据
                    const bDiv = document.getElementById('marketBreadth');
                    if (bDiv) bDiv.innerHTML = `涨<span style="color:#e94560;">${fd.rise}</span> 跌<span style="color:#4ade80;">${fd.fall}</span> 平<span style="color:#888;">${fd.flat}</span>`;
                }

                const riskRes = await fetch('/api/risk-index');
                const riskData = await riskRes.json();
                if (riskData.success && riskData.data) {
                    const rd = riskData.data;
                    const rDiv = document.getElementById('riskIndex');
                    if (rDiv && rDiv.children[0]) {
                        rDiv.children[0].textContent = rd.score;
                        rDiv.children[0].style.color = rd.color;
                        if (rDiv.children[1]) { rDiv.children[1].textContent = rd.level; rDiv.children[1].style.color = rd.color; }
                        const ptr = rDiv.querySelector('div[style*="position:absolute"]');
                        if (ptr) ptr.style.left = rd.score + '%';
                        // 更新总结和指标
                        const rConc = document.getElementById('riskConclusion');
                        if (rConc) rConc.textContent = getRiskSummary(rd.score);
                        const rMet = document.getElementById('riskMetrics');
                        if (rMet) rMet.innerHTML = '<div style="margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.08); font-size:11px; color:#666; line-height:1.7;">' +
                            '<div>融资余额5日变化: <span style="color:#ccc;">' + (rd.fin_bal_5d != null ? (rd.fin_bal_5d >= 0 ? '+' : '') + rd.fin_bal_5d.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>两融余额10日变化: <span style="color:#ccc;">' + (rd.fin_bal_10d != null ? (rd.fin_bal_10d >= 0 ? '+' : '') + rd.fin_bal_10d.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>融资买入活跃度: <span style="color:#ccc;">' + (rd.fin_buy_heat != null ? (rd.fin_buy_heat >= 0 ? '+' : '') + rd.fin_buy_heat.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>沪深5日涨跌: <span style="color:#ccc;">' + (rd.idx_5d != null ? (rd.idx_5d >= 0 ? '+' : '') + rd.idx_5d.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>沪深10日涨跌: <span style="color:#ccc;">' + (rd.idx_10d != null ? (rd.idx_10d >= 0 ? '+' : '') + rd.idx_10d.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>20日最大回撤: <span style="color:#ccc;">' + (rd.idx_20d_dd != null ? rd.idx_20d_dd.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>10日波动率: <span style="color:#ccc;">' + (rd.volatility != null ? rd.volatility.toFixed(2) + '%' : '--') + '</span></div>' +
                            '<div>情绪面因子: <span style="color:#ccc;">' + (rd.panic_score_in != null ? rd.panic_score_in.toFixed(1) + '分' : '--') + '</span></div>' +
                            '<div>涨跌结构因子: <span style="color:#ccc;">' + (rd.limit_score_in != null ? rd.limit_score_in.toFixed(1) + '分' : '--') + '</span></div>' +
                            '</div>' + riskExplain;
                    }
                }
            } catch(e) { console.log('Auto refresh error:', e); }
            refreshPickedQuotes();
        }

        setInterval(refreshRealtimeData, 10000);
    </script>
</body>
</html>
