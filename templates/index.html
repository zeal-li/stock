<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鑫多多 - 资金流向</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 200px;
            background: #16213e;
            padding: 20px 0;
            border-right: 1px solid #0f3460;
        }

        .logo {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #0f3460;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 24px;
            color: #e94560;
            font-weight: bold;
        }

        .nav-section {
            margin-bottom: 10px;
        }

        .section-title {
            padding: 10px 20px;
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-item {
            padding: 12px 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 3px solid transparent;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        .nav-item:hover {
            background: #0f3460;
            border-left-color: #e94560;
        }

        .nav-item.active {
            background: #0f3460;
            border-left-color: #e94560;
            color: #e94560;
        }

        .nav-icon {
            font-size: 18px;
        }

        .main-content {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-title {
            font-size: 24px;
            color: #fff;
        }

        .refresh-btn {
            background: #e94560;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #d63850;
        }

        .index-card {
            background: #16213e;
            border-radius: 10px;
            border: 1px solid #0f3460;
            padding: 20px;
            margin-bottom: 20px;
        }

        .index-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .index-info {
            display: flex;
            align-items: baseline;
            gap: 15px;
        }

        .index-name {
            font-size: 16px;
            color: #888;
        }

        .index-price {
            font-size: 28px;
            font-weight: bold;
        }

        .index-change {
            font-size: 16px;
        }

        .index-change.up {
            color: #e94560;
        }

        .index-change.down {
            color: #4ade80;
        }

        .chart-row {
            display: flex;
            gap: 20px;
        }

        .chart-box {
            flex: 1;
            height: 180px;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .chart-box canvas {
            flex: 1;
            min-height: 0;
            max-height: 150px;
        }

        .chart-title {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            background: #16213e;
            padding: 5px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            padding: 10px 20px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tab-btn:hover {
            color: #fff;
            background: #0f3460;
        }

        .tab-btn.active {
            background: #e94560;
            color: white;
        }

        .stats-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 24px;
            font-weight: bold;
        }

        .stat-card .value.positive {
            color: #e94560;
        }

        .stat-card .value.negative {
            color: #4ade80;
        }

        .data-table {
            width: 100%;
            background: #16213e;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #0f3460;
        }

        .data-table table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table thead {
            background: #0f3460;
        }

        .data-table th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #fff;
        }

        .data-table tbody tr {
            border-bottom: 1px solid #0f3460;
            transition: background 0.3s;
        }

        .data-table tbody tr:hover {
            background: #0f3460;
        }

        .data-table td {
            padding: 15px;
            color: #ddd;
        }

        .change-up {
            color: #e94560 !important;
        }

        .change-down {
            color: #4ade80 !important;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #888;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #e94560;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <h1>鑫多多</h1>
            </div>
            <div class="nav-section">
                <div class="nav-item active" data-page="money-flow">
                    <span class="nav-icon">💰</span>
                    <span>资金流向</span>
                </div>
            </div>
        </div>
        <div class="main-content">
            <div class="page-header">
                <h1 class="page-title">💰 资金流向</h1>
                <button class="refresh-btn" onclick="loadAllData()">🔄 刷新数据</button>
            </div>

            <div class="index-card" id="index-card">
                <div class="loading">正在加载上证指数...</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-page="concept">
                    💡 概念板块
                </button>
                <button class="tab-btn" data-page="industry">
                    🏭 行业板块
                </button>
                <button class="tab-btn" data-page="index">
                    📊 指数板块
                </button>
            </div>

            <div id="content-area">
                <div class="loading">正在加载数据...</div>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 'concept';
        let minuteChart = null;
        let turnoverChart = null;

        function formatTurnover(value) {
            if (value >= 10000) {
                return (value / 10000).toFixed(2) + '万亿';
            }
            return value.toFixed(2) + '亿';
        }

        async function loadIndexWithChart() {
            const indexCard = document.getElementById('index-card');
            indexCard.innerHTML = '<div class="loading">正在加载上证指数...</div>';

            try {
                const indexRes = await fetch('/api/major-indices');
                const indexResult = await indexRes.json();

                let indexData = null;
                if (indexResult.success && indexResult.data.length > 0) {
                    indexData = indexResult.data[0];
                }

                if (!indexData) {
                    indexCard.innerHTML = '<div class="error">暂无指数数据</div>';
                    return;
                }

                const isUp = indexData.change.startsWith('+');
                const changeClass = isUp ? 'up' : 'down';
                const lineColor = isUp ? '#e94560' : '#4ade80';
                const gradientColor = isUp ? 'rgba(233, 69, 96, 0.2)' : 'rgba(74, 222, 128, 0.2)';

                indexCard.innerHTML = `
                        <div class="index-header">
                            <div class="index-info">
                                <span class="index-name">${indexData.name}</span>
                                <span class="index-price">${indexData.price}</span>
                                <span class="index-change ${changeClass}">${indexData.change} ${indexData.change_value}</span>
                            </div>
                        </div>
                        <div style="display: flex; gap: 30px; font-size: 13px; color: #888; margin-bottom: 15px;">
                            <span>加载中...</span>
                        </div>
                        <div class="chart-row">
                            <div class="chart-box" style="position:relative;">
                                <canvas id="minuteChart"></canvas>
                                <div id="minuteLoading" style="position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;pointer-events:none;">加载中...</div>
                                <div class="chart-title">分时走势</div>
                            </div>
                            <div class="chart-box">
                                <canvas id="turnoverChart"></canvas>
                                <div class="chart-title">大盘净资金流入</div>
                            </div>
                        </div>
                    `;

                // 等待真实分时数据到达后再绘制图表，避免显示直线 mock 数据

                fetch('/api/turnover-minute')
                    .then(res => res.json())
                    .then(turnoverResult => {
                        let turnoverTimes = [];
                        let turnovers = [];
                        let predictTurnovers = [];
                        let turnoverHeader = {};

                        if (turnoverResult.success && turnoverResult.data.times) {
                            turnoverTimes = turnoverResult.data.times;
                            turnovers = turnoverResult.data.turnovers;
                            predictTurnovers = turnoverResult.data.predict_turnovers;
                            turnoverHeader = turnoverResult.data.header || {};
                        }

                        let headerInfo = '';
                        if (turnoverHeader && turnoverHeader.turnover) {
                            const todayTurnover = turnoverHeader.turnover / 100000000;
                            const yesterdayTurnover = turnoverHeader.turnover_pre / 100000000;
                            const change = turnoverHeader.turnover_change / 100000000;
                            headerInfo = `
                                <div style="display: flex; gap: 30px; font-size: 13px; color: #888;">
                                    <span>当日成交额: <span style="color: #fff;">${todayTurnover.toFixed(2)}亿</span></span>
                                    <span>昨日成交额: <span style="color: #fff;">${yesterdayTurnover.toFixed(2)}亿</span></span>
                                    <span>较昨日变动: <span style="color: ${change >= 0 ? '#e94560' : '#4ade80'};">${change >= 0 ? '+' : ''}${change.toFixed(2)}亿</span></span>
                                </div>
                            `;
                        }

                        const headerDiv = indexCard.querySelector('div[style*="gap: 30px"]');
                        if (headerDiv) headerDiv.innerHTML = headerInfo || '<span style="color:#888;">暂无成交额数据</span>';

                        const ctxTurnover = document.getElementById('turnoverChart').getContext('2d');
                        if (turnoverChart) turnoverChart.destroy();

                        turnoverChart = new Chart(ctxTurnover, {
                            type: 'line',
                            data: {
                                labels: turnoverTimes,
                                datasets: [{
                                    label: '净流入',
                                    data: turnovers.map((v, i) => v - (predictTurnovers[i] || 0)),
                                    borderColor: '#fbbf24',
                                    backgroundColor: function(context) {
                                        const chart = context.chart;
                                        const ctx = chart.ctx;
                                        const gradient = ctx.createLinearGradient(0, 0, 0, 180);
                                        gradient.addColorStop(0, 'rgba(233, 69, 96, 0.25)');
                                        gradient.addColorStop(0.5, 'rgba(233, 69, 96, 0.05)');
                                        gradient.addColorStop(0.5, 'rgba(74, 222, 128, 0.05)');
                                        gradient.addColorStop(1, 'rgba(74, 222, 128, 0.25)');
                                        return gradient;
                                    },
                                    borderWidth: 2,
                                    pointRadius: 0,
                                    pointHoverRadius: 3,
                                    tension: 0.3,
                                    fill: true
                                }, {
                                    data: Array(turnoverTimes.length).fill(0),
                                    borderColor: 'rgba(255,255,255,0.3)',
                                    borderWidth: 1,
                                    borderDash: [4, 4],
                                    pointRadius: 0,
                                    fill: false
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: {
                                    legend: { display: false },
                                    tooltip: {
                                        mode: 'index', intersect: false,
                                        backgroundColor: '#16213e', titleColor: '#fff', bodyColor: '#ddd', borderColor: '#0f3460', borderWidth: 1,
                                        callbacks: { label: function(context) { const v = context.raw; return (v >= 0 ? '+' : '') + v.toFixed(2) + '亿'; } }
                                    }
                                },
                                scales: {
                                    x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', autoSkip: false, maxRotation: 0, font: { size: 10 }, callback: function(value, index) { return index % 15 === 0 ? this.getLabelForValue(value) : ''; } } },
                                    y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', font: { size: 10 }, callback: function(value) { return value.toFixed(2) + '亿'; } } }
                                },
                                interaction: { mode: 'index', intersect: false }
                            }
                        });
                    })
                    .catch(err => console.log('成交额数据加载失败:', err));

                fetch('/api/sh000001-minute')
                    .then(res => res.json())
                    .then(minuteResult => {
                        const minuteLoading = document.getElementById('minuteLoading');
                        if (minuteResult.success && minuteResult.data.times && minuteResult.data.prices && minuteResult.data.times.length > 0) {
                            const times = minuteResult.data.times;
                            const prices = minuteResult.data.prices;
                            const preClose = minuteResult.data.preClose || 0;

                            const ctxMinute = document.getElementById('minuteChart').getContext('2d');
                            if (minuteChart) minuteChart.destroy();

                            const gradient = ctxMinute.createLinearGradient(0, 0, 0, 180);
                            gradient.addColorStop(0, gradientColor);
                            gradient.addColorStop(1, 'rgba(26, 26, 46, 0)');

                            minuteChart = new Chart(ctxMinute, {
                                type: 'line',
                                data: {
                                    labels: times,
                                    datasets: [{
                                        data: prices,
                                        borderColor: lineColor,
                                        backgroundColor: gradient,
                                        borderWidth: 2,
                                        fill: true,
                                        tension: 0.1,
                                        pointRadius: 0,
                                        pointHoverRadius: 4
                                    }, {
                                        data: Array(times.length).fill(preClose),
                                        borderColor: '#888888',
                                        borderWidth: 1,
                                        borderDash: [6, 4],
                                        pointRadius: 0,
                                        pointHoverRadius: 0,
                                        fill: false,
                                        order: 1
                                    }]
                                },
                                options: {
                                    responsive: true,
                                    maintainAspectRatio: false,
                                    plugins: { legend: { display: false } },
                                    scales: {
                                        x: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888', autoSkip: false, maxRotation: 0, callback: function(value, index) { return index % 4 === 0 ? this.getLabelForValue(value) : ''; } } },
                                        y: { grid: { color: 'rgba(255, 255, 255, 0.1)' }, ticks: { color: '#888' } }
                                    },
                                    interaction: { mode: 'nearest', axis: 'x', intersect: false }
                                }
                            });
                            if (minuteLoading) minuteLoading.style.display = 'none';
                        } else {
                            // 分时数据获取失败
                            if (minuteLoading) minuteLoading.textContent = '暂无分时数据';
                        }
                    })
                    .catch(err => {
                        console.log('分时数据加载失败:', err);
                        const minuteLoading = document.getElementById('minuteLoading');
                        if (minuteLoading) minuteLoading.textContent = '分时数据加载失败';
                    });

            } catch (error) {
                indexCard.innerHTML = `<div class="error">指数加载失败</div>`;
            }
        }

        function generateMockFlowData() {
            const times = [];
            const netFlows = [];

            let cumulative = 0;
            for (let i = 0; i < 46; i++) {
                const hour = i < 19 ? 9 : 13;
                const minute = i < 19 ? 30 + (i * 5) : (i - 19) * 5;
                if (i === 19) {
                    times.push('11:30');
                    netFlows.push(cumulative);
                    continue;
                }
                if (hour === 13 && minute > 55) break;

                const timeStr = `${hour}:${minute.toString().padStart(2, '0')}`;
                times.push(timeStr);

                const change = (Math.random() - 0.5) * 100;
                cumulative += change;
                netFlows.push(Math.round(cumulative));
            }

            return { times, netFlows };
        }

        async function loadMoneyFlowData() {
            const contentArea = document.getElementById('content-area');
            contentArea.innerHTML = '<div class="loading">正在加载数据...</div>';

            try {
                const response = await fetch(`/api/money-flow/${currentPage}`);
                const result = await response.json();

                if (result.success && result.data.length > 0) {
                    let totalInflow = 0;
                    let totalOutflow = 0;

                    result.data.forEach(item => {
                        const inflowVal = parseFloat(item.inflow.replace('亿', '')) || 0;
                        const outflowVal = parseFloat(item.outflow.replace('亿', '')) || 0;
                        totalInflow += inflowVal;
                        totalOutflow += outflowVal;
                    });

                    const netFlow = (totalInflow - totalOutflow).toFixed(2);

                    let html = `
                        <div class="stats-cards">
                            <div class="stat-card">
                                <h3>总流入</h3>
                                <div class="value positive">${totalInflow.toFixed(2)}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>总流出</h3>
                                <div class="value negative">${totalOutflow.toFixed(2)}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>净流入</h3>
                                <div class="value ${netFlow >= 0 ? 'positive' : 'negative'}">${netFlow >= 0 ? '+' : ''}${netFlow}亿</div>
                            </div>
                            <div class="stat-card">
                                <h3>板块数量</h3>
                                <div class="value">${result.data.length}</div>
                            </div>
                        </div>
                        <div class="data-table">
                            <table>
                                <thead>
                                    <tr>
                                        <th>排名</th>
                                        <th>板块名称</th>
                                        <th>涨跌幅</th>
                                        <th>流入</th>
                                        <th>流出</th>
                                        <th>净流入</th>
                                    </tr>
                                </thead>
                                <tbody>
                    `;

                    result.data.forEach(item => {
                        const changeClass = item.change.startsWith('+') ? 'change-up' : 'change-down';
                        html += `
                            <tr>
                                <td>${item.rank}</td>
                                <td>${item.name}</td>
                                <td class="${changeClass}">${item.change}</td>
                                <td>${item.inflow}</td>
                                <td>${item.outflow}</td>
                                <td class="${changeClass}">${item.net_inflow}</td>
                            </tr>
                        `;
                    });

                    html += '</tbody></table></div>';
                    contentArea.innerHTML = html;
                } else {
                    contentArea.innerHTML = '<div class="error">暂无数据，请稍后重试</div>';
                }
            } catch (error) {
                contentArea.innerHTML = `<div class="error">数据加载失败: ${error.message}</div>`;
            }
        }

        async function loadAllData() {
            loadIndexWithChart();
            loadMoneyFlowData();
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');

                currentPage = this.getAttribute('data-page');
                loadMoneyFlowData();
            });
        });

        loadAllData();
    </script>
</body>
</html>
