图表区
图表	数据来源	内容
分时走势	/api/sh000001-minute	上证当日分时折线图
大盘净资金流入	/api/market-fund-flow	主力(金色) + 中单(紫色) + 散户(蓝色) 三线
融资融券	/api/margin-trading	两融余额/融资余额/融券余额/融资买入额 四线双Y轴
右侧面板
面板	数据来源	内容
市场风险指数	/api/risk-index	0~100 综合评分：融资+趋势+情绪+涨跌结构 四大因子
市场恐慌指数	/api/fear-index	0~100 综合评分：指数压力+分时形态+涨跌广度+资金压力
一句话总结
指数行情面板 = 上证价格信息（头部1行）+ 成交额概要（头部2行）+ 3张图表（分时/资金流/融资融券）+ 2个评分面板（风险/恐慌），共涉及 7 条独立 API 请求。