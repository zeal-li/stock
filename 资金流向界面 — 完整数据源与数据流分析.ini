三、数据源总览
数据源	URL 模式	被哪些模块使用
东财 ulist	push2delay.eastmoney.com/api/qt/ulist.np/get	① 指数行情、⑥ 恐慌(涨跌幅+广度)、⑦ 风险(广度+日K)
东财 trends2	push2delay.eastmoney.com/api/qt/stock/trends2/get	② 上证分时、⑥ 恐慌(上证+深证分时)
东财 fflow	push2delay.eastmoney.com/api/qt/stock/fflow/kline/get	③ 资金流、⑥ 恐慌(资金因子)
东财 push2his	push2his.eastmoney.com/api/qt/stock/kline/get	⑦ 风险(上证+深证30天日K)
同花顺	dq.10jqka.com.cn/fuyao/market_analysis_api/...	④ 成交额
akshare	ak.stock_margin_sse() / ak.stock_margin_szse()	⑤ 融资融券、⑦ 风险(融资因子)
四、重复请求问题（性能瓶颈）
重磅问题：恐慌指数的子数据源有大量重复请求！

子数据源	被恐慌指数(⑥)调用	也被独立模块调用	重复情况
get_sh000001_minute_data()	✅ 子源②	模块② 独立调用	每10秒调2次
get_market_fund_flow()	✅ 子源⑤	模块③ 独立调用	每10秒调2次
_fetch_breadth()	✅ 子源④	— (仅恐慌内部用)	不重复
_fetch_idx_changes()	✅ 子源①	—	不重复
_fetch_sz_intraday()	✅ 子源③	— (前端没展示)	不重复
每次页面加载或刷新时，上证分时和资金流数据被请求了 2 次：

一次来自独立模块（②和③）
一次来自恐慌指数的子计算（⑥）
五、优化建议
合并重复请求：恐慌指数可复用前端已请求的上证分时和资金流数据，或者后端用共享缓存避免重复 HTTP 请求
akshare 性能瓶颈：融资融券(⑤)和风险指数(⑦)使用 akshare 库，这是本地 HTTP 爬虫，速度较慢。风险指数调用 stock_margin_sse + stock_margin_szse（2次本地调用）+ _fetch_daily_closes（2次网络请求），共 4 个子任务并行
成交额分时未使用：模块⑧的后端数据已准备好（分钟级成交额曲线），前端可增加一个成交额分时图，不需要额外的网络请求
缓存策略不一致：恐慌指数和风险指数共用 5s TTL，但实际上风险指数的数据源（akshare + 日K）变化频率极低，可以放长到分钟级别
前端 10s 轮询：7 个接口（①②③④⑥⑦）每 10 秒各请求一次，高峰时约每秒 0.7 次请求。可以考虑合并为单次批量接口减少 HTTP 开销