应用
前端触发: loadIndexWithChart() → fetch '/api/fear-index'
    ↓
后端: market_data.py → get_fear_index()
    ↓
并行调用 5 个子数据源 (ThreadPoolExecutor max_workers=4):
  ├── ① _fetch_idx_changes()     → 东方财富 ulist    (沪深指数涨跌幅)
  ├── ② get_sh000001_minute_data() → 东方财富 trends2  (上证分时)
  ├── ③ _fetch_sz_intraday()      → 东方财富 trends2  (深证分时)
  ├── ④ _fetch_breadth()          → 东方财富 ulist    (涨跌家数)
  └── ⑤ get_market_fund_flow()    → 东方财富 fflow    (主力资金流)
    ↓
多因子加权合成 0~100 分:
  指数压力(0-22) + 分时压力(0-28) + 广度压力(0-22)
  + 资金压力(0-12) + base(20) - 稳定因子(反弹补偿)
    ↓
前端渲染: #fearIndex 面板
          大号数字(颜色随等级) + 渐变色条+指针 + 8项指标明细
