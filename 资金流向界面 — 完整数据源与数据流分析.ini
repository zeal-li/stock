资金流向界面 — 完整数据源与数据流分析
资金流向页面共 9 个模块，涉及 6 个外部数据源，9 条 API 路由。

一、各模块数据源速查表
模块	API 端点	数据源	后端文件	加载时机	缓存TTL
① 指数行情	/api/major-indices	东方财富 push2delay ulist	market_data.py:383	页面加载 + 每10s	3s
② 分时走势	/api/sh000001-minute	东方财富 push2delay trends2	market_data.py:408	页面加载 + 每10s	5s
③ 资金流图	/api/market-fund-flow	东方财富 push2delay fflow/kline	market_data.py:464	页面加载 + 每10s	5s
④ 成交额文字	/api/turnover-minute	同花顺 dq.10jqka.com.cn	money_flow.py:1	页面加载 + 每10s	无
⑤ 融资融券	/api/margin-trading	akshare stock_margin_sse()	market_data.py:528	仅页面加载	无
